[package]
name = "mail-assistent"
version = "0.1.0"
description = "Lokales Mail-Archiv mit KI-Kategorisierung"
authors = ["Adrian Altner"]
edition = "2024"

[lib]
# Der `_lib`-Suffix vermeidet Namenskonflikte mit dem Binary unter Windows.
name = "mail_assistent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"   # Links im Standardbrowser öffnen (nur http/https)
tauri-plugin-dialog = "2"   # Speichern-Dialog für Anhänge
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

# Datenbank: SQLite statisch eingebaut, FTS5 ist im Bundle enthalten
rusqlite = { version = "0.41", features = ["bundled"] }

# IMAP über tokio + rustls (kein OpenSSL)
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "1"
futures = "0.3"

# Mail-Verarbeitung
mail-parser = "1"
# Senden: nur rustls (ring, webpki-roots), implizites TLS
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls-tls"] }
lol_html = "3"          # HTML-Bereinigung für die Anzeige (Regel 6)
base64 = "0.22"         # eingebettete Bilder als data:-URL
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Schlüsselbund
keyring = "4"

# KI-Server (/v1/messages) per HTTP; TLS nur über rustls mit ring (wie IMAP)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }

[dev-dependencies]
tempfile = "3"
