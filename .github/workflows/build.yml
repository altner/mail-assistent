# Baut die Installer für macOS, Windows und Linux. Läuft nur auf Anfrage
# (Actions → Bauen → Run workflow) oder bei einem Versions-Tag `v*`.
# Bei einem Tag landen die Installer zusätzlich in einem GitHub-Release.
# Signiert wird bisher nur ad hoc (macOS), siehe README unter „Builds“.
name: Bauen

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Tag passt zur Version in tauri.conf.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu Version $version in tauri.conf.json"
            exit 1
          fi

      - name: Linux-Bibliotheken für Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libdbus-1-dev patchelf pkg-config build-essential

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run tauri build

      - uses: actions/upload-artifact@v5
        with:
          name: mail-assistent-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Ein Job sammelt alle Installer ein und legt das Release einmal an;
  # drei parallele Jobs würden sich beim Anlegen in die Quere kommen.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: installer
          merge-multiple: true

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'
          ## Installieren

          | System | Datei |
          |---|---|
          | macOS (Apple Silicon) | `.dmg` öffnen, App in „Programme“ ziehen |
          | Windows | `-setup.exe` oder `.msi` |
          | Linux | `.deb` (Debian/Ubuntu), `.rpm` (Fedora) oder `.AppImage` (`chmod +x`) |

          Die App ist nur ad hoc signiert und nicht notarisiert. Beim ersten Start warnt das System:

          - **macOS:** Rechtsklick auf die App → Öffnen. Ab macOS 15: Systemeinstellungen →
            Datenschutz & Sicherheit → „Dennoch öffnen“.
          - **Windows:** SmartScreen → „Weitere Informationen“ → „Trotzdem ausführen“.
          - **Linux:** Für die Passwörter muss ein Secret Service laufen (GNOME Schlüsselbund oder KWallet).
          NOTES
          find installer -type f -print
          find installer -type f -print0 | xargs -0 gh release create "$GITHUB_REF_NAME" \
            --title "Mail-Assistent ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
